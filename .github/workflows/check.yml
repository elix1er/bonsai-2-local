name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y shellcheck lsof
      - run: pip install ruff==0.15.0
      - run: npm ci --prefix web
      - run: cd web && npx playwright install --with-deps chromium
      - run: ./check.sh
